<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marilla - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-hotel"></i>
                <span>Marilla</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active"><i class="fa-solid fa-bed"></i> Rooms</a>
                <a href="#" class="nav-item"><i class="fa-solid fa-users"></i> Guests</a>
                <a href="#" class="nav-item"><i class="fa-solid fa-calendar-check"></i> Bookings</a>
                <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Search rooms...">
                </div>
                <div class="admin-profile">
                    <div class="notifications"><i class="fa-solid fa-bell"></i></div>
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff" alt="Admin" class="avatar">
                </div>
            </header>

            <div class="content">
                <div class="page-header">
                    <h2>Room Management</h2>
                    <button class="btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add New Room</button>
                </div>

                <div class="card-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-door-open"></i></div>
                        <div class="stat-info">
                            <h3>Total Rooms</h3>
                            <p id="total-rooms">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success"><i class="fa-solid fa-check-circle"></i></div>
                        <div class="stat-info">
                            <h3>Available</h3>
                            <p id="available-rooms">0</p>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th>Room Number</th>
                                <th>Type</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="rooms-table-body">
                            <!-- Rooms will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Add/Edit Room -->
    <div id="room-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add New Room</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="room-form">
                <input type="hidden" id="room-id">
                <div class="form-group">
                    <label>Room Number</label>
                    <input type="text" id="roomNumber" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="roomType" required>
                        <option value="Single">Single</option>
                        <option value="Double">Double</option>
                        <option value="Suite">Suite</option>
                        <option value="Deluxe">Deluxe</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price ($)</label>
                    <input type="number" id="roomPrice" required min="0">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="roomDescription" rows="3"></textarea>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="roomAvailable" checked>
                    <label for="roomAvailable">Available</label>
                </div>
                <button type="submit" class="btn-primary w-100">Save Room</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
